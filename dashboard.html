<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online Voting System | Results</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="page-header">
    <nav class="top-nav">
      <a href="index.html" class="logo">VotePoll</a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Login</a>
        <a href="vote.html" class="nav-link">Vote</a>
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
        <a href="admin.html" class="nav-link">Admin</a>
      </div>
    </nav>
  </header>

  <main class="page-grid">
    <section class="panel-card">
      <div class="section-header">
        <div>
          <h1>Live Results</h1>
          <p id="resultsMessage">Loading results...</p>
        </div>
        <div class="action-row">
          <button id="logoutBtn" class="btn btn-secondary">Logout</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <span>Total Voters</span>
          <strong id="totalVoters">0</strong>
        </div>
        <div class="stat-card">
          <span>Total Votes Cast</span>
          <strong id="totalVotes">0</strong>
        </div>
      </div>

      <div id="resultsArea">
        <div class="chart-panel">
          <canvas id="resultChart"></canvas>
        </div>
        <div id="candidateResults" class="card-grid"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="app.js"></script>
</body>
</html>
